{% assign post = include.post %}
<li class="essay-row">
  <a class="essay-row-link" href="{{ post.url | relative_url }}">
    <span class="essay-row-main">
      <h3 class="essay-row-title">{{ post.title }}</h3>
      {% if post.subtitle %}<span class="essay-row-sub">{{ post.subtitle }}</span>{% endif %}
    </span>
    <time class="essay-row-date" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %Y" }}</time>
  </a>
</li>
