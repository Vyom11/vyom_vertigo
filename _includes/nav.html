<header class="masthead">
  <div class="wrap masthead-inner">
    <a href="{{ '/' | relative_url }}" class="wordmark">Vyom Pandya</a>

    <nav aria-label="Main">
      <ul class="nav">
        <li><a href="{{ '/case-studies/' | relative_url }}" {% if page.url contains '/case-studies' %}aria-current="page"{% endif %}>Work</a></li>
        <li><a href="{{ '/writing/' | relative_url }}" {% if page.url contains '/writing' or page.layout == 'post' %}aria-current="page"{% endif %}>Writing</a></li>
        <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}aria-current="page"{% endif %}>Contact</a></li>
      </ul>
    </nav>
  </div>
  {% if page.layout == 'post' or page.layout == 'case-study' %}
  <div class="read-progress" aria-hidden="true"><span></span></div>
  {% endif %}
</header>
