<header class="masthead">
  <div class="wrap masthead-inner">
    <a href="{{ '/' | relative_url }}" class="wordmark">Vyom Pandya</a>

    <nav aria-label="Main">
      <ul class="nav">
        <li><a href="{{ '/writing/' | relative_url }}" {% if page.url contains '/writing' or page.layout == 'post' %}aria-current="page"{% endif %}>Writing</a></li>
        <li><a href="{{ '/case-studies/' | relative_url }}" {% if page.url contains '/case-studies' %}aria-current="page"{% endif %}>Work</a></li>
        <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}aria-current="page"{% endif %}>About</a></li>
        <li><a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}aria-current="page"{% endif %}>Contact</a></li>
      </ul>
    </nav>

    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Switch to light mode" title="Switch theme">
      <svg class="theme-icon theme-icon--moon" viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><path d="M9 2.9c-2 0-3.8.8-5.2 2.2.7-.3 1.4-.5 2.1-.5 3 .1 5.300 2.700 5.200 5.600-.1 2.900-2.400 5.100-5.200 5.200-.7 0-1.500-.2-2.100-.5 2.800 2.900 7.300 2.900 10.100.2s3-7.300.3-10.100c-1.400-1.300-3.300-2.200-5.200-2.100z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg class="theme-icon theme-icon--sun" viewBox="0 0 20 20" width="22" height="22" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><circle cx="10" cy="10" r="3.8"/><path d="M10 1.8v2M10 16.2v2M18.2 10h-2M3.8 10h-2M15.8 15.8l-1.4-1.4M5.6 5.6 4.2 4.2M15.8 4.2l-1.4 1.4M5.6 14.4l-1.4 1.4"/></g></svg>
    </button>
  </div>
  {% if page.layout == 'post' or page.layout == 'case-study' %}
  <div class="read-progress" aria-hidden="true"><span></span></div>
  {% endif %}
</header>
