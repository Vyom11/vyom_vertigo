{% assign cs = include.case_study %}
<li class="work-row">
  <a class="work-row-link" href="{{ cs.url | relative_url }}">
    <span class="work-row-no"><span class="work-row-no-lbl">No.</span><span class="work-row-no-val">0{{ cs.order }}</span></span>
    <span class="work-row-main">
      <span class="work-row-meta">{{ cs.industry }}</span>
      <h3 class="work-row-title">{{ cs.title }}</h3>
      <span class="work-row-summary">{{ cs.summary }}</span>
    </span>
    {% if cs.headline_metrics and cs.headline_metrics.size > 0 %}
    {% assign m = cs.headline_metrics.first %}
    <span class="work-row-metric">
      <span class="work-row-metric-val">{{ m.value }}</span>
      <span class="work-row-metric-lbl">{{ m.label }}</span>
    </span>
    {% endif %}
  </a>
</li>
