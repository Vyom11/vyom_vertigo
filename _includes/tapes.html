{%- comment -%}
  A pile of cassettes, one per role. Each can be picked up and moved (drag, or arrow keys);
  a nod to the tapes in Drive My Car.
{%- endcomment -%}
{%- assign roles = site.data.roles -%}
<div class="tapes">
  <ul class="tape-stack" aria-label="What I do" data-tapes style="--count: {{ roles.size }}">
    {%- for role in roles %}
    <li class="tape-item" style="--i: {{ forloop.index0 }}; --role-color: {{ role.color }}">
      <button type="button" class="tape" aria-label="{{ role.name }}. Tape {{ forloop.index }} of {{ roles.size }}. Drag it, or use the arrow keys to move it.">
        <span class="tape-label" aria-hidden="true">
          <span class="tape-role">{{ role.name }}</span>
          <span class="tape-meta">A&middot;0{{ forloop.index }}</span>
        </span>
        <svg class="tape-window" viewBox="0 0 120 40" aria-hidden="true" focusable="false">
          <rect width="120" height="40" rx="20" fill="#0C0B0A"/>
          <circle cx="31" cy="20" r="{% cycle '17', '15', '13', '16', '12', '14' %}" fill="#3B2619"/>
          <circle cx="89" cy="20" r="{% cycle '10', '12', '14', '11', '15', '13' %}" fill="#3B2619"/>
          <g class="tape-hub"><circle cx="31" cy="20" r="7" fill="#E9E6DE"/><circle cx="31" cy="20" r="4.2" fill="#0C0B0A"/><path d="M30.3 15.8h1.4v1.9h-1.4zM30.3 22.3h1.4v1.9h-1.4zM26.8 19.3v1.4h1.9v-1.4zM33.3 19.3v1.4h1.9v-1.4z" fill="#E9E6DE"/></g>
          <g class="tape-hub"><circle cx="89" cy="20" r="7" fill="#E9E6DE"/><circle cx="89" cy="20" r="4.2" fill="#0C0B0A"/><path d="M88.3 15.8h1.4v1.9h-1.4zM88.3 22.3h1.4v1.9h-1.4zM84.8 19.3v1.4h1.9v-1.4zM91.3 19.3v1.4h1.9v-1.4z" fill="#E9E6DE"/></g>
          <rect x="10" y="5" width="100" height="1.2" rx=".6" fill="#fff" opacity=".07"/>
        </svg>
        <span class="tape-foot" aria-hidden="true"></span>
      </button>
    </li>
    {%- endfor %}
  </ul>
  <p class="tapes-note">
    <span>Pick one up. Like the tapes in <a href="#films"><em>Drive My Car</em></a>.</span>
    <button type="button" class="tapes-restack" data-tapes-restack hidden>Restack</button>
  </p>
</div>
