<!-- Director's commentary: a CC toggle and one subtitle line. Lines come from data-commentary attributes on the page. -->
<button type="button" class="cc-toggle" id="cc-toggle" aria-pressed="false" title="Director's commentary">
  <span class="cc-badge" aria-hidden="true">CC</span>
  <span class="cc-label">Commentary <span class="cc-state">off</span></span>
</button>
<p class="cc-caption" id="cc-caption" aria-live="polite" hidden></p>
